name: Accessibility CI

on:
  pull_request:
    branches:
      - master
      - main

jobs:
  accessibility:
    name: WCAG 2.1 A/AA Accessibility Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: site

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: site

      - name: Build Next.js app
        run: npm run build
        working-directory: site
        env:
          NODE_ENV: production

      - name: Start Next.js server
        run: npm run start &
        working-directory: site

      - name: Wait for server to be ready
        run: npx wait-on http://localhost:3000 --timeout 60000

      - name: Run accessibility tests
        run: npx playwright test e2e/accessibility.spec.ts --reporter=list
        working-directory: site

      - name: Generate accessibility report
        if: always()
        run: |
          echo "## Accessibility Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if npx playwright test e2e/accessibility.spec.ts --reporter=json 2>/dev/null | jq -e '.suites[0].suites // .suites' > /dev/null 2>&1; then
            RESULTS=$(npx playwright test e2e/accessibility.spec.ts --reporter=json 2>/dev/null || true)
            PASSED=$(echo "$RESULTS" | jq '[.. | .status? // empty | select(. == "expected")] | length' 2>/dev/null || echo "0")
            FAILED=$(echo "$RESULTS" | jq '[.. | .status? // empty | select(. == "unexpected")] | length' 2>/dev/null || echo "0")
            echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
            echo "| Pages passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
            echo "| Pages failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
          else
            echo "See test output above for detailed violation report." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Powered by [axe-core](https://github.com/dequelabs/axe-core) + [Playwright](https://playwright.dev/docs/accessibility-testing)" >> $GITHUB_STEP_SUMMARY
        working-directory: site
