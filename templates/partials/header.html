{{define "header"}}
<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-500 bg-white/95 backdrop-blur-md shadow-xs py-3 dark:bg-stone-900/95 dark:shadow-stone-950/50">
  <nav class="container-custom flex items-center justify-between px-6 md:px-8">
    <!-- Logo -->
    <a href="/" class="flex items-center gap-3 group" aria-label="Pelangi Capsule Hostel - home">
      <svg class="h-9 w-9 shrink-0" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <rect x="2.5" y="7.5" width="35" height="25" rx="8" stroke="#5BBCE4" stroke-width="3" />
        <path d="M11 32.5 V20 a9 9 0 0 1 18 0 v12.5" stroke="#5BBCE4" stroke-width="3" stroke-linecap="round" fill="none" />
        <circle cx="20" cy="18.5" r="3" fill="#5BBCE4" />
        <line x1="11" y1="27.5" x2="29" y2="27.5" stroke="#5BBCE4" stroke-width="3" stroke-linecap="round" />
      </svg>
      <div class="flex flex-col">
        <span class="font-display text-xl font-medium tracking-tight transition-colors duration-300 text-stone-900 dark:text-stone-100">Pelangi</span>
        <span class="text-[10px] font-medium tracking-widest uppercase transition-colors duration-300 text-stone-500 dark:text-stone-400">Capsule Hostel</span>
      </div>
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden md:flex items-center gap-1">
      {{range .NavLinks}}
      <a href="{{.Href}}" class="px-4 py-2 text-sm font-medium transition-all duration-300 rounded-full text-stone-600 hover:text-stone-900 hover:bg-stone-100 dark:text-stone-400 dark:hover:text-stone-100 dark:hover:bg-stone-800" data-nav-href="{{.Href}}">{{.Label}}</a>
      {{end}}
      <button type="button" data-search-open title="Search (Ctrl+K)" aria-label="Open search" class="p-2 text-stone-500 hover:text-stone-900 hover:bg-stone-100 rounded-full transition-colors dark:text-stone-400 dark:hover:text-stone-100 dark:hover:bg-stone-800 inline-flex">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </button>
      <!-- Language selector -->
      <details class="relative notranslate" translate="no" data-lang-menu>
        <summary class="list-none cursor-pointer select-none px-3 py-2 text-sm font-medium rounded-full text-stone-600 hover:text-stone-900 hover:bg-stone-100 dark:text-stone-400 dark:hover:text-stone-100 dark:hover:bg-stone-800 inline-flex items-center gap-1.5" aria-label="Select language">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" /></svg>
          <span data-lang-label>EN</span>
          <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
        </summary>
        <div class="absolute right-0 mt-2 w-44 bg-white dark:bg-stone-800 rounded-xl shadow-xl border border-stone-100 dark:border-stone-700 py-1 z-50">
          <button type="button" onclick="setSiteLang('en')" data-lang-opt="en" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">English</button>
          <button type="button" onclick="setSiteLang('zh-CN')" data-lang-opt="zh-CN" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">中文</button>
          <button type="button" onclick="setSiteLang('ms')" data-lang-opt="ms" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">Bahasa Melayu</button>
        </div>
      </details>
      <a href="/book" class="ml-2 px-6 py-2.5 text-sm font-medium rounded-full transition-all duration-300 bg-amber-700 text-white hover:bg-amber-800">Book Now</a>
    </div>

    <!-- Mobile Search + Menu Buttons -->
    <div class="flex items-center gap-1 md:hidden">
      <button type="button" data-search-open aria-label="Search" class="p-2 rounded-full transition-colors duration-300 text-stone-700 hover:bg-stone-100 dark:text-stone-300 dark:hover:bg-stone-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </button>
      <button type="button" data-menu-toggle aria-label="Open menu" aria-expanded="false" class="p-2 rounded-full transition-colors duration-300 text-stone-700 hover:bg-stone-100 dark:text-stone-300 dark:hover:bg-stone-800">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <div data-mobile-menu class="absolute top-full left-4 right-4 mt-2 bg-white rounded-2xl shadow-xl md:hidden dark:bg-stone-800 dark:shadow-stone-950/50 overflow-hidden transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none">
      <div class="py-4">
        {{range .NavLinks}}
        <a href="{{.Href}}" class="block px-6 py-3 text-stone-700 hover:bg-stone-50 hover:text-stone-900 transition-colors dark:text-stone-300 dark:hover:bg-stone-700 dark:hover:text-stone-100" data-nav-href="{{.Href}}">{{.Label}}</a>
        {{end}}
        <div class="px-6 py-3 border-t border-stone-100 mt-2 dark:border-stone-700 notranslate" translate="no">
          <p class="text-xs font-medium tracking-widest uppercase text-stone-400 mb-2">Language</p>
          <div class="flex gap-2">
            <button type="button" onclick="setSiteLang('en')" data-lang-opt="en" class="flex-1 py-2 text-sm rounded-lg border border-stone-200 dark:border-stone-600 text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700">EN</button>
            <button type="button" onclick="setSiteLang('zh-CN')" data-lang-opt="zh-CN" class="flex-1 py-2 text-sm rounded-lg border border-stone-200 dark:border-stone-600 text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700">中文</button>
            <button type="button" onclick="setSiteLang('ms')" data-lang-opt="ms" class="flex-1 py-2 text-sm rounded-lg border border-stone-200 dark:border-stone-600 text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700">BM</button>
          </div>
        </div>
        <div class="px-6 py-3 border-t border-stone-100 mt-2 dark:border-stone-700">
          <a href="/book" class="block w-full text-center bg-amber-700 text-white py-3 rounded-xl font-medium hover:bg-amber-800 transition-colors">Book Now</a>
        </div>
      </div>
    </div>
  </nav>
</header>
{{end}}
