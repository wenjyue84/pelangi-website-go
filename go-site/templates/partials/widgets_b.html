{{define "widgetsB"}}
<!-- ═══════════════════════════════════════════════════════════════════
     widgets_b.html — static HTML for CookieConsent + SearchDialog.
     Behaviour driven by go-site/static/js/widgets_b.js (IIFE).
     Both panels start hidden; JS shows them on demand.
     ═══════════════════════════════════════════════════════════════════ -->

<!-- ── Cookie Consent Banner ────────────────────────────────────────── -->
<div
  id="cookie-banner"
  role="dialog"
  aria-label="Cookie consent"
  aria-describedby="cookie-consent-description"
  class="fixed bottom-0 left-0 right-0 z-60 p-4 md:p-6 entry-fade-up hidden"
  style="transition-behavior:allow-discrete"
>
  <div class="mx-auto max-w-3xl rounded-xl border border-stone-200 dark:border-stone-700 bg-white dark:bg-stone-800 p-4 shadow-xl md:p-6">

    <!-- Description paragraph — text nodes injected by widgets_b.js -->
    <p id="cookie-consent-description" class="text-sm text-stone-600 dark:text-stone-400 md:text-base">
      <span id="cc-body-text"></span><a
        href="/privacy-policy"
        id="cc-privacy-link"
        class="underline text-stone-700 hover:text-stone-900 dark:text-stone-300 dark:hover:text-stone-100"
      ></a>
    </p>

    <!-- Manage Preferences panel (hidden until "Manage" is clicked) -->
    <div id="cc-prefs-panel" class="hidden mt-4 space-y-3 rounded-lg border border-stone-200 dark:border-stone-700 bg-stone-50 dark:bg-stone-900 p-4">

      <!-- Essential — always on -->
      <div class="flex items-start justify-between gap-3">
        <div>
          <p id="cc-essential-label" class="text-sm font-medium text-stone-800 dark:text-stone-200"></p>
          <p id="cc-essential-desc" class="text-xs text-stone-500 dark:text-stone-400 mt-0.5"></p>
        </div>
        <span id="cc-always-on" class="shrink-0 rounded-full bg-stone-200 dark:bg-stone-700 px-2.5 py-1 text-xs font-medium text-stone-600 dark:text-stone-400"></span>
      </div>

      <!-- Analytics — opt-in toggle (NOT pre-ticked) -->
      <div class="flex items-start justify-between gap-3">
        <div>
          <p id="cc-analytics-label" class="text-sm font-medium text-stone-800 dark:text-stone-200"></p>
          <p id="cc-analytics-desc" class="text-xs text-stone-500 dark:text-stone-400 mt-0.5"></p>
        </div>
        <button
          type="button"
          id="cc-analytics-toggle"
          role="switch"
          aria-checked="false"
          class="relative shrink-0 inline-flex h-6 w-11 items-center rounded-full transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700 bg-stone-500 dark:bg-stone-600"
        >
          <span id="cc-toggle-knob" class="inline-block h-4 w-4 rounded-full bg-white shadow-sm transition-transform translate-x-1"></span>
        </button>
      </div>

      <button
        type="button"
        id="cc-save-prefs"
        class="mt-2 w-full rounded-lg bg-amber-700 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-amber-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700 sm:w-auto"
      ></button>
    </div>

    <!-- Action buttons (shown when prefs panel is hidden) -->
    <div id="cc-action-btns" class="mt-4 flex flex-col gap-2 sm:flex-row sm:justify-end sm:gap-3">
      <button
        type="button"
        id="cc-manage"
        class="rounded-lg border border-stone-500 dark:border-stone-600 bg-white dark:bg-stone-700 px-5 py-2.5 text-sm font-medium text-stone-700 dark:text-stone-300 transition-colors hover:bg-stone-50 dark:hover:bg-stone-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700"
      ></button>
      <button
        type="button"
        id="cc-reject"
        class="rounded-lg border border-stone-500 dark:border-stone-600 bg-white dark:bg-stone-700 px-5 py-2.5 text-sm font-medium text-stone-700 dark:text-stone-300 transition-colors hover:bg-stone-50 dark:hover:bg-stone-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700"
      ></button>
      <button
        type="button"
        id="cc-accept"
        class="rounded-lg bg-amber-700 px-5 py-2.5 text-sm font-medium text-white transition-colors hover:bg-amber-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-amber-700"
      ></button>
    </div>

  </div>
</div>

<!-- ── Search Dialog ─────────────────────────────────────────────────── -->
<div
  id="search-overlay"
  class="fixed inset-0 z-60 flex items-start justify-center pt-[15vh] hidden"
>
  <!-- Backdrop -->
  <div id="search-backdrop" class="fixed inset-0 bg-black/40 backdrop-blur-xs entry-fade" aria-hidden="true"></div>

  <!-- Dialog -->
  <div
    id="search-dialog"
    role="dialog"
    aria-label="Site search"
    aria-modal="true"
    class="relative z-10 w-full max-w-lg mx-4 bg-white dark:bg-stone-800 rounded-2xl shadow-2xl border border-stone-200 dark:border-stone-700 overflow-hidden entry-zoom-in"
  >
    <!-- Search input row -->
    <div class="flex items-center gap-3 px-4 py-3 border-b border-stone-100 dark:border-stone-700">
      <svg class="w-5 h-5 text-stone-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
      </svg>
      <input
        id="search-input"
        type="text"
        placeholder="Search blog posts and guides..."
        autocomplete="off"
        spellcheck="false"
        aria-autocomplete="list"
        aria-controls="search-results"
        class="flex-1 text-base text-stone-900 dark:text-stone-100 placeholder:text-stone-400 bg-transparent outline-hidden focus-visible:outline-amber-700 dark:focus-visible:outline-amber-400"
      />
      <kbd class="hidden sm:inline-flex items-center gap-1 px-2 py-0.5 text-xs text-stone-500 bg-stone-100 dark:bg-stone-700 rounded-sm border border-stone-500 dark:border-stone-600 font-mono">Esc</kbd>
    </div>

    <!-- Results area -->
    <div class="max-h-80 overflow-y-auto">
      <div id="search-no-results" class="hidden px-4 py-8 text-center text-stone-500">
        <p class="text-sm">No results found for &ldquo;<span id="search-no-results-query"></span>&rdquo;</p>
        <p class="text-xs mt-1 text-stone-400">Try a different search term</p>
      </div>
      <ul id="search-results" role="listbox" class="py-2 hidden"></ul>
    </div>

    <!-- Keyboard hint footer (shown only when results are present) -->
    <div id="search-footer" class="hidden px-4 py-2 border-t border-stone-100 dark:border-stone-700 flex items-center gap-4 text-[11px] text-stone-400">
      <span class="flex items-center gap-1">
        <kbd class="px-1 py-0.5 bg-stone-100 rounded-sm border border-stone-500 font-mono text-[10px]">&uarr;</kbd>
        <kbd class="px-1 py-0.5 bg-stone-100 rounded-sm border border-stone-500 font-mono text-[10px]">&darr;</kbd>
        navigate
      </span>
      <span class="flex items-center gap-1">
        <kbd class="px-1 py-0.5 bg-stone-100 rounded-sm border border-stone-500 font-mono text-[10px]">&crarr;</kbd>
        open
      </span>
      <span class="flex items-center gap-1">
        <kbd class="px-1 py-0.5 bg-stone-100 rounded-sm border border-stone-500 font-mono text-[10px]">esc</kbd>
        close
      </span>
    </div>
  </div>
</div>

<!-- Tailwind safelist: JS-generated dynamic classes that must appear in CSS output -->
<span aria-hidden="true" class="hidden pl-[1.875rem] bg-amber-50 bg-amber-100 bg-blue-100 text-amber-800 text-blue-800 dark:bg-amber-900/20 hover:bg-stone-50 dark:hover:bg-stone-700 cursor-pointer"></span>

<script src="/static/js/widgets_b.js" defer></script>
{{end}}
