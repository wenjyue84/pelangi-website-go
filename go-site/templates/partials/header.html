{{define "header"}}
<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-500 bg-white/95 backdrop-blur-md shadow-xs py-3 dark:bg-stone-900/95 dark:shadow-stone-950/50">
  <nav class="container-custom flex items-center justify-between px-6 md:px-8">
    <!-- Logo -->
    <a href="/" class="flex items-center group" aria-label="Pelangi Capsule Hostel - home">
      <!-- ?v=2 busts the 4h CF/browser cache holding the pre-2026-08-07 dark-text logo -->
      <img src="/images/logo.png?v=2" alt="Pelangi Capsule Hostel" class="h-12 w-auto shrink-0">
    </a>

    <!-- Desktop Navigation -->
    <div class="hidden md:flex items-center gap-1">
      {{range .NavLinks}}
      <a href="{{.Href}}" class="px-4 py-2 text-sm font-medium transition-all duration-300 rounded-full text-stone-600 hover:text-stone-900 hover:bg-stone-100 dark:text-stone-400 dark:hover:text-stone-100 dark:hover:bg-stone-800" data-nav-href="{{.Href}}">{{.Label}}</a>
      {{end}}
      <button type="button" data-search-open title="Search (Ctrl+K)" aria-label="Open search" class="p-2 text-stone-500 hover:text-stone-900 hover:bg-stone-100 rounded-full transition-colors dark:text-stone-400 dark:hover:text-stone-100 dark:hover:bg-stone-800 inline-flex">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </button>
      <!-- Language selector -->
      <details class="relative notranslate" translate="no" data-lang-menu>
        <summary class="list-none cursor-pointer select-none px-3 py-2 text-sm font-medium rounded-full text-stone-600 hover:text-stone-900 hover:bg-stone-100 dark:text-stone-400 dark:hover:text-stone-100 dark:hover:bg-stone-800 inline-flex items-center gap-1.5" aria-label="Select language">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" /></svg>
          <span data-lang-label>EN</span>
          <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" /></svg>
        </summary>
        <div class="absolute right-0 mt-2 w-52 bg-white dark:bg-stone-800 rounded-xl shadow-xl border border-stone-100 dark:border-stone-700 py-1 z-50">
          <button type="button" onclick="{{if .AltEN}}location.href='{{.AltEN}}'{{else}}setSiteLang('en'){{end}}" data-lang-opt="en" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">English</button>
          <button type="button" onclick="setSiteLang('zh-CN')" data-lang-opt="zh-CN" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">中文</button>
          <button type="button" onclick="setSiteLang('ms')" data-lang-opt="ms" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">Bahasa Melayu</button>
          <div class="border-t border-stone-100 dark:border-stone-700 my-1"></div>
          <button type="button" onclick="setSiteLang('ja')" data-lang-opt="ja" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇯🇵 日本語</button>
          <button type="button" onclick="setSiteLang('ko')" data-lang-opt="ko" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇰🇷 한국어</button>
          <button type="button" onclick="setSiteLang('ar')" data-lang-opt="ar" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇸🇦 العربية</button>
          <button type="button" onclick="setSiteLang('hi')" data-lang-opt="hi" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇮🇳 हिन्दी</button>
          <button type="button" onclick="setSiteLang('ta')" data-lang-opt="ta" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇮🇳 தமிழ்</button>
          <button type="button" onclick="setSiteLang('th')" data-lang-opt="th" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇹🇭 ไทย</button>
          <button type="button" onclick="setSiteLang('vi')" data-lang-opt="vi" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇻🇳 Việt</button>
          <button type="button" onclick="setSiteLang('my')" data-lang-opt="my" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇲🇲 မြန်မာ</button>
          <button type="button" onclick="setSiteLang('es')" data-lang-opt="es" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇪🇸 Español</button>
          <button type="button" onclick="setSiteLang('fr')" data-lang-opt="fr" class="w-full text-left px-4 py-2 text-sm text-stone-700 hover:bg-stone-50 dark:text-stone-300 dark:hover:bg-stone-700">🇫🇷 Français</button>
        </div>
      </details>
      <a href="/book" class="ml-2 px-6 py-2.5 text-sm font-medium rounded-full transition-all duration-300 bg-amber-700 text-white hover:bg-amber-800">Book Now</a>
    </div>

    <!-- Mobile Search + Menu Buttons -->
    <div class="flex items-center gap-1 md:hidden">
      <button type="button" data-search-open aria-label="Search" class="p-2 rounded-full transition-colors duration-300 text-stone-700 hover:bg-stone-100 dark:text-stone-300 dark:hover:bg-stone-800">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
      </button>
      <button type="button" data-menu-toggle aria-label="Open menu" aria-expanded="false" class="p-2 rounded-full transition-colors duration-300 text-stone-700 hover:bg-stone-100 dark:text-stone-300 dark:hover:bg-stone-800">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 6h16M4 12h16M4 18h16" /></svg>
      </button>
    </div>

    <!-- Mobile Navigation -->
    <div data-mobile-menu class="absolute top-full left-4 right-4 mt-2 bg-white rounded-2xl shadow-xl md:hidden dark:bg-stone-800 dark:shadow-stone-950/50 overflow-hidden transition-all duration-300 opacity-0 -translate-y-4 pointer-events-none">
      <div class="py-4">
        {{range .NavLinks}}
        <a href="{{.Href}}" class="block px-6 py-3 text-stone-700 hover:bg-stone-50 hover:text-stone-900 transition-colors dark:text-stone-300 dark:hover:bg-stone-700 dark:hover:text-stone-100" data-nav-href="{{.Href}}">{{.Label}}</a>
        {{end}}
        <div class="px-6 py-3 border-t border-stone-100 mt-2 dark:border-stone-700 notranslate" translate="no">
          <p class="text-xs font-medium tracking-widest uppercase text-stone-400 mb-2">Language</p>
          <div class="flex gap-2 mb-2">
            <button type="button" onclick="{{if .AltEN}}location.href='{{.AltEN}}'{{else}}setSiteLang('en'){{end}}" data-lang-opt="en" class="flex-1 py-2 text-sm rounded-lg border border-stone-200 dark:border-stone-600 text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700">EN</button>
            <button type="button" onclick="setSiteLang('zh-CN')" data-lang-opt="zh-CN" class="flex-1 py-2 text-sm rounded-lg border border-stone-200 dark:border-stone-600 text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700">中文</button>
            <button type="button" onclick="setSiteLang('ms')" data-lang-opt="ms" class="flex-1 py-2 text-sm rounded-lg border border-stone-200 dark:border-stone-600 text-stone-700 dark:text-stone-300 hover:bg-stone-50 dark:hover:bg-stone-700">BM</button>
          </div>
          <div class="grid grid-cols-2 gap-1">
            <button type="button" onclick="setSiteLang('ja')" data-lang-opt="ja" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇯🇵 日本語</button>
            <button type="button" onclick="setSiteLang('ko')" data-lang-opt="ko" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇰🇷 한국어</button>
            <button type="button" onclick="setSiteLang('ar')" data-lang-opt="ar" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇸🇦 العربية</button>
            <button type="button" onclick="setSiteLang('hi')" data-lang-opt="hi" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇮🇳 हिन्दी</button>
            <button type="button" onclick="setSiteLang('ta')" data-lang-opt="ta" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇮🇳 தமிழ்</button>
            <button type="button" onclick="setSiteLang('th')" data-lang-opt="th" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇹🇭 ไทย</button>
            <button type="button" onclick="setSiteLang('vi')" data-lang-opt="vi" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇻🇳 Việt</button>
            <button type="button" onclick="setSiteLang('my')" data-lang-opt="my" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇲🇲 မြန်မာ</button>
            <button type="button" onclick="setSiteLang('es')" data-lang-opt="es" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇪🇸 Español</button>
            <button type="button" onclick="setSiteLang('fr')" data-lang-opt="fr" class="text-left text-xs py-1.5 px-2 rounded-lg border border-stone-200 dark:border-stone-600 text-stone-600 dark:text-stone-400 hover:bg-stone-50 dark:hover:bg-stone-700 truncate">🇫🇷 Français</button>
          </div>
        </div>
        <div class="px-6 py-3 border-t border-stone-100 mt-2 dark:border-stone-700">
          <a href="/book" class="block w-full text-center bg-amber-700 text-white py-3 rounded-xl font-medium hover:bg-amber-800 transition-colors">Book Now</a>
        </div>
      </div>
    </div>
  </nav>
</header>
{{end}}
